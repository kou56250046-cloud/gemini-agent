<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>Gem の編集（ダミー）</title></head>
<body>
<!-- 拡張の試験用。Gem の編集画面の「指示」欄と保存ボタンだけを真似る。保存ボタンが押されたら window.__saved が true になる -->
<label>指示<textarea data-ga-gem-instructions aria-label="指示" rows="10" cols="80">古い指示文</textarea></label>
<button type="button" id="save" onclick="window.__saved = true">更新</button>
<script>window.__saved = false;</script>
</body>
</html>
